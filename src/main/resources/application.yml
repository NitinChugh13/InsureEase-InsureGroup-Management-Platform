spring:
  application:
    name: insureease-platform
  datasource:
    url: ${DB_URL:jdbc:h2:mem:insureease;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:insureease}
    password: ${DB_PASSWORD:insureease_secret}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

insureease:
  security:
    jwt:
      secret: ${JWT_SECRET:InsureEaseSuperSecretKeyForHmacSha256SigningMustBeAtLeast256BitsLong2026!}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7
    encryption:
      aes-key: ${PII_AES_KEY:0123456789ABCDEF0123456789ABCDEF} # 32-byte (256-bit) key for AES-256-GCM
  underwriting:
    senior-approval-si-threshold: 50000000.00
    senior-approval-premium-threshold: 1000000.00
    max-auto-discount-pct: 10.00
  claims:
    senior-approval-amount-threshold: 200000.00
  payments:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:rzp_test_insureease_demo}
      key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_secret_insureease_2026}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_razorpay_insureease_2026}
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_insureease_demo}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_stripe_insureease_2026}
  storage:
    local-dir: ${STORAGE_DIR:./target/insureease-storage}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
