services:
  postgres:
    image: postgres:16-alpine
    container_name: insureease-postgres
    environment:
      POSTGRES_DB: insureease
      POSTGRES_USER: insureease
      POSTGRES_PASSWORD: insureease_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureease -d insureease"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: insureease-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: insureease-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: insureease_minio
      MINIO_ROOT_PASSWORD: insureease_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: insureease-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
